<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>General Illustrations Gallery</title>
    <meta
      name="description"
      content="Bilingual recipe gallery for provider-neutral illustration recipes: categories, styles, composition patterns, prompt templates, provider sets, and per-provider example comparison."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div>
        <p class="eyebrow">Shuozeli / general-illustrations</p>
        <h1 data-i18n="h1">Recipe Gallery</h1>
      </div>
      <p class="summary" data-i18n="summary"></p>
    </header>

    <main>
      <section class="toolbar" id="category-nav" aria-label="Category filters">
        <button type="button" id="lang-toggle" class="lang-toggle"></button>
        <a href="#all" data-i18n="navAll">All</a>
      </section>

      <section class="intro-grid">
        <div>
          <h2 data-i18n="introTitle1"></h2>
          <p data-i18n="introBody1"></p>
        </div>
        <div>
          <h2 data-i18n="introTitle2"></h2>
          <p data-i18n="introBody2"></p>
        </div>
      </section>

      <div id="gallery-root" aria-live="polite">
        <p class="loading">Loading recipes...</p>
      </div>
    </main>

    <footer class="site-footer">
      <p data-i18n="footer"></p>
    </footer>

    <script>
      // ---- i18n strings for the static page chrome ----
      const UI = {
        en: {
          htmlLang: "en",
          h1: "Recipe Gallery",
          summary:
            "Browse reusable illustration recipes by category. Each card binds a style, composition pattern, prompt template, provider set, tags, and a per-provider example strip (Codex / Ark / Gemini / ChatGPT). Cards are generated from specs/general-illustrations.json, so the page cannot drift from the canonical recipes.",
          navAll: "All",
          introTitle1: "What This Shows",
          introBody1:
            "The gallery is the human-facing layer over the JSON spec. Pick a category first, then a recipe. Each recipe carries a recipe-faithful Gemini prompt and a ChatGPT prompt (override or Gemini fallback) — no global photorealistic wrapper.",
          introTitle2: "Provider Comparison",
          introBody2:
            "The image strip on each card shows the same recipe rendered by different providers (Codex, Ark/Seedream, Gemini, ChatGPT) where example assets exist. The recommended-providers chips list which backends suit the recipe.",
          footer:
            "Generated from specs/general-illustrations.json. Edit the spec, run build_gallery.py and skill render — do not hand-edit this page.",
          loading: "Loading recipes...",
          loadFailed: "Failed to load gallery.json: ",
          noExample: "no example yet",
          style: "Style",
          pattern: "Pattern",
          template: "Template",
          toOther: "中文",
        },
        zh: {
          htmlLang: "zh",
          h1: "配方画廊",
          summary:
            "按类别浏览可复用的插图配方。每张卡片绑定一个风格、构图模式、提示词模板、provider 集、标签，以及一条按 provider 的示例对比图带（Codex / Ark / Gemini / ChatGPT）。卡片由 specs/general-illustrations.json 生成，因此页面不会与规范里的配方脱节。",
          navAll: "全部",
          introTitle1: "这个页面展示什么",
          introBody1:
            "画廊是 JSON 规范之上的人类可读层。先选类别，再选配方。每个配方都带一条忠于风格的 Gemini 提示词和一条 ChatGPT 提示词（覆盖或回退到 Gemini）——不套全局写实包装。",
          introTitle2: "Provider 对比",
          introBody2:
            "每张卡片的图带展示同一配方在不同 provider（Codex、Ark/Seedream、Gemini、ChatGPT）下的产出（有示例资产时）。recommended-providers 标签列出适合该配方的后端。",
          footer:
            "由 specs/general-illustrations.json 生成。修改规范后运行 build_gallery.py 与 skill render——请勿手改本页面。",
          loading: "加载配方中…",
          loadFailed: "加载 gallery.json 失败：",
          noExample: "暂无示例",
          style: "风格",
          pattern: "构图",
          template: "模板",
          toOther: "EN",
        },
      };

      const SUPPORTED = ["en", "zh"];

      function detectLang() {
        const saved = localStorage.getItem("gi-lang");
        if (saved && SUPPORTED.includes(saved)) return saved;
        return (navigator.language || "en").toLowerCase().startsWith("zh")
          ? "zh"
          : "en";
      }

      let lang = detectLang();
      let galleryData = null;

      // Pick a localized value: a {zh,en} object -> field[lang] with fallback,
      // a plain string -> returned as-is.
      function loc(value) {
        if (value && typeof value === "object") {
          return value[lang] || value.en || value.zh || "";
        }
        return value == null ? "" : value;
      }

      function el(tag, cls, text) {
        const node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text != null) node.textContent = text;
        return node;
      }

      function imageStrip(recipe) {
        const images = recipe.images || [];
        if (!images.length) {
          return el("div", "img-placeholder", UI[lang].noExample);
        }
        const strip = el("div", "provider-strip");
        for (const im of images) {
          const fig = el("figure", "provider-shot");
          const img = el("img");
          img.src = im.src;
          img.alt = `${loc(recipe.name)} - ${im.provider}`;
          img.loading = "lazy";
          fig.appendChild(img);
          fig.appendChild(el("figcaption", null, im.provider));
          strip.appendChild(fig);
        }
        return strip;
      }

      function recipeCard(recipe) {
        const card = el("article", "recipe-card");
        card.id = recipe.id;
        card.appendChild(imageStrip(recipe));

        const body = el("div", "card-body");

        const topline = el("div", "card-topline");
        topline.appendChild(el("span", null, recipe.style_id));
        topline.appendChild(el("span", null, recipe.id));
        body.appendChild(topline);

        body.appendChild(el("h2", null, loc(recipe.name)));
        body.appendChild(el("p", null, loc(recipe.description)));

        const dl = el("dl");
        const rows = [
          [UI[lang].style, recipe.style_id],
          [UI[lang].pattern, recipe.composition_pattern_id],
          [UI[lang].template, recipe.prompt_template_id],
        ];
        for (const [k, v] of rows) {
          const row = el("div");
          row.appendChild(el("dt", null, k));
          row.appendChild(el("dd", null, v));
          dl.appendChild(row);
        }
        body.appendChild(dl);

        const providers = el("div", "providers");
        for (const p of recipe.recommended_providers || []) {
          providers.appendChild(el("span", "chip", p));
        }
        body.appendChild(providers);

        body.appendChild(el("p", "tags", (recipe.tags || []).join(" / ")));

        card.appendChild(body);
        return card;
      }

      function applyChrome() {
        const strings = UI[lang];
        document.documentElement.lang = strings.htmlLang;
        document.title = galleryData ? galleryData.title : "General Illustrations Gallery";
        for (const node of document.querySelectorAll("[data-i18n]")) {
          const key = node.getAttribute("data-i18n");
          if (strings[key] != null) node.textContent = strings[key];
        }
        document.getElementById("lang-toggle").textContent = strings.toOther;
      }

      function renderGallery() {
        const root = document.getElementById("gallery-root");
        root.innerHTML = "";
        if (!galleryData) return;

        const nav = document.getElementById("category-nav");
        // remove previously rendered category links (keep toggle + All)
        nav.querySelectorAll("a.cat-link").forEach((a) => a.remove());
        for (const cat of galleryData.categories) {
          const a = el("a", "cat-link", loc(cat.name));
          a.href = `#cat-${cat.id}`;
          nav.appendChild(a);
        }

        for (const cat of galleryData.categories) {
          const section = el("section", "category");
          section.id = `cat-${cat.id}`;
          const head = el("div", "category-head");
          head.appendChild(el("h2", null, loc(cat.name)));
          head.appendChild(el("p", "category-summary", loc(cat.summary)));
          head.appendChild(el("code", "category-id", cat.id));
          section.appendChild(head);

          const grid = el("section", "recipe-grid");
          const recipes = galleryData.recipes.filter((r) => r.category === cat.id);
          for (const r of recipes) grid.appendChild(recipeCard(r));
          section.appendChild(grid);
          root.appendChild(section);
        }
      }

      function renderAll() {
        applyChrome();
        renderGallery();
      }

      document.getElementById("lang-toggle").addEventListener("click", () => {
        lang = lang === "en" ? "zh" : "en";
        localStorage.setItem("gi-lang", lang);
        renderAll();
      });

      applyChrome();
      fetch("gallery.json")
        .then((r) => {
          if (!r.ok) throw new Error(`gallery.json ${r.status}`);
          return r.json();
        })
        .then((data) => {
          galleryData = data;
          renderAll();
        })
        .catch((err) => {
          document.getElementById("gallery-root").innerHTML =
            `<p class="loading">${UI[lang].loadFailed}${err.message}</p>`;
        });
    </script>
  </body>
</html>
